
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eligify | Admin Login</title>


<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">


<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


<link rel="stylesheet" href="login.css">

</head>


<body>


<div class="container">


<div class="login-card">


<img
src="eligify.jpeg"
class="logo"
alt="Eligify Logo">



<h1>

<i class="fa-solid fa-user-shield"></i>

Admin Login

</h1>



<p class="subtitle">

Authorized Administrators Only

</p>




<form id="adminLoginForm">



<div class="input-box">


<i class="fa-solid fa-envelope"></i>


<input

type="email"

id="adminEmail"

name="adminEmail"

placeholder="Admin Email"

autocomplete="off"

autocapitalize="none"

spellcheck="false"

required>

</div>




<div class="input-box">


<i class="fa-solid fa-lock"></i>


<input

type="password"

id="adminPassword"

name="adminPassword"

placeholder="Password"

autocomplete="new-password"

required>



<i
class="fa-solid fa-eye toggle"
id="togglePassword">
</i>



</div>




<button

type="submit"

class="login-btn">


Login as Admin


</button>




<div class="signup">


<a href="login.html">


<i class="fa-solid fa-arrow-left"></i>

Back to Student Login


</a>


</div>



</form>



</div>


</div>




<!-- Toast -->

<div
id="toast"
class="toast">


<i class="fa-solid fa-circle-check"></i>

<span></span>


</div>




<script src="admin-login.js"></script>


</body>

</html>
