<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Eligify | Category Scholarships</title>



<!-- Google Font -->

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
rel="stylesheet">


<!-- Remix Icons -->

<link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
rel="stylesheet">



<!-- CSS -->

<link rel="stylesheet" href="category.css">


</head>



<body>



<!-- =========================
HEADER
========================= -->


<header class="category-header">


<a href="dashboard.html" class="back-btn">

<i class="ri-arrow-left-line"></i>

</a>




<div class="header-content">


<h1 id="categoryTitle">

Scholarships

</h1>



<p>

Find opportunities made for you

</p>


</div>



</header>









<!-- =========================
SEARCH
========================= -->


<section class="search-section">


<div class="search-box">


<i class="ri-search-line"></i>



<input

type="text"

id="categorySearch"

placeholder="Search scholarships..."

>



</div>



</section>









<!-- =========================
CATEGORY BANNER
========================= -->


<section class="category-info">



<div class="category-icon">


<i class="ri-award-fill"></i>


</div>





<div>


<h2 id="selectedCategory">

Loading...

</h2>



<p>

Scholarships available in this category

</p>



</div>



</section>









<!-- =========================
SCHOLARSHIP LIST
========================= -->


<section class="scholarship-section">



<div

id="categoryContainer"

class="scholarship-container">


</div>



</section>








<!-- =========================
NO RESULT
========================= -->


<div

id="noResult"

class="no-result"

style="display:none;">



<i class="ri-search-eye-line"></i>



<h3>

No Scholarships Found

</h3>



<p>

Try another search or category

</p>



</div>









<!-- =========================
LOADER
========================= -->


<div

id="categoryLoader"

class="loader">



<div class="skeleton-card"></div>


<div class="skeleton-card"></div>


<div class="skeleton-card"></div>



</div>









<!-- JS -->


<script src="storage-guard.js"></script>
    <script type="module" src="category.js"></script>



</body>


</html>
