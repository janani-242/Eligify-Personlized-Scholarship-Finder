
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Eligify | Reset Password</title>


    <!-- =====================================================
         FONT
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="reset-password.css"
    >

</head>


<body>


    <!-- =====================================================
         MAIN CONTAINER
    ====================================================== -->

    <div class="container">


        <!-- =================================================
             RESET PASSWORD CARD
        ================================================== -->

        <div class="forgot-card">


            <!-- =============================================
                 LOGO
            ============================================== -->

            <img
                src="Eligify.jpeg"
                class="logo"
                alt="Eligify"
            >


            <!-- =============================================
                 TITLE
            ============================================== -->

            <h1>
                Reset Password
            </h1>


            <p class="subtitle">
                Create a new password for your account
            </p>


            <!-- =============================================
                 RESET PASSWORD FORM
            ============================================== -->

            <form
                id="resetPasswordForm"
                novalidate
            >


                <!-- =========================================
                     NEW PASSWORD
                ========================================== -->

                <input
                    type="password"
                    id="newPassword"
                    name="newPassword"
                    placeholder="Enter New Password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >


                <!-- =========================================
                     CONFIRM PASSWORD
                ========================================== -->

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm New Password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >


                <!-- =========================================
                     PASSWORD VALIDATION MESSAGE
                ========================================== -->

                <p
                    id="passwordMessage"
                    class="verification-message"
                    aria-live="polite"
                ></p>


                <!-- =========================================
                     RESET BUTTON
                ========================================== -->

                <button
                    type="submit"
                    id="resetPasswordButton"
                >
                    Reset Password
                </button>

            </form>


            <!-- =============================================
                 GENERAL MESSAGE
            ============================================== -->

            <p
                id="message"
                aria-live="polite"
            ></p>


            <!-- =============================================
                 SUCCESS TOAST
            ============================================== -->

            <div
                id="toast"
                class="toast"
                role="status"
                aria-live="polite"
            >
                <span>
                    Password Reset Successfully
                </span>
            </div>


            <!-- =============================================
                 BACK TO LOGIN
            ============================================== -->

            <a
                href="login.html"
                class="back"
            >
                ← Back to Login
            </a>


        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="reset-password.js"></script>

</body>

</html>
